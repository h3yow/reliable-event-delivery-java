server.port=0

# --- reliable event delivery ---
# Delivery attempts per event before it goes DEAD.
events.max-attempts=3
# Automatic dispatcher: continuously drains PENDING events. Set false for tests/demos.
events.dispatcher.enabled=true
# Delay between dispatcher ticks (ms).
events.dispatcher.poll-interval-ms=200
# Max events dispatched per tick.
events.dispatcher.batch-size=50
# Worker threads executing handlers.
events.dispatcher.threads=4
# Retry cadence: initial backoff, multiplier, upper bound (ms).
events.retry.initial-backoff-ms=500
events.retry.backoff-multiplier=2.0
events.retry.max-backoff-ms=10000
# An IN_PROGRESS event older than this (ms) is recovered back to PENDING.
events.recovery.stuck-timeout-ms=30000
# Max PENDING + IN_PROGRESS events before new submissions get 429 CAPACITY_EXCEEDED.
events.capacity.max-pending=10000
