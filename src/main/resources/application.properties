server.port=0

# 本地嵌入式 H2，无需任何外部中间件或真实凭据
spring.datasource.url=jdbc:h2:mem:reliable-events;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# 可靠投递参数（可被测试/环境覆盖）
reliable.delivery.max-attempts=5
reliable.delivery.initial-backoff=500ms
reliable.delivery.backoff-multiplier=2.0
reliable.delivery.max-backoff=30s
reliable.delivery.lock-timeout=60s
reliable.delivery.worker-count=2
reliable.delivery.poll-interval=200ms
