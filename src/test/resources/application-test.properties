# 测试用快速参数
reliable.delivery.max-attempts=3
reliable.delivery.initial-backoff=10ms
reliable.delivery.backoff-multiplier=2.0
reliable.delivery.max-backoff=50ms
reliable.delivery.lock-timeout=2s
